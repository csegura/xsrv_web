[workspace]
resolver = "2"
members = ["crates/wire", "crates/xsrv-server", "crates/xsrv-wasm"]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"

# The server uses catch_unwind, so panics must unwind.
[profile.release]
lto = "fat"
codegen-units = 1
